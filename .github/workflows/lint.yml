name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Run linters
        run: npm run lint

  test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: test_root_password
          MYSQL_DATABASE: colorslab_test
          MYSQL_USER: colors_test
          MYSQL_PASSWORD: colors_test_password
        ports:
          - 3306/tcp
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mysqli
          coverage: none

      - name: Install dependencies
        run: npm ci

      - name: Run unit and integration tests
        run: npm test
        env:
          COLORS_DB_HOST: 127.0.0.1
          COLORS_DB_PORT: ${{ job.services.mysql.ports[3306] }}
          COLORS_DB_NAME: colorslab_test
          COLORS_DB_USER: colors_test
          COLORS_DB_PASSWORD: colors_test_password
